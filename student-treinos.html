<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meus Treinos | FORCE GYM</title><link rel="icon" href="assets/img/logo.png"><link rel="stylesheet" href="assets/css/style.css"><style>
.student-page{min-height:100vh;background:#050a14;color:#f1f6ff;background-image:radial-gradient(circle at 80% 0%,rgba(17,83,150,.3),transparent 35%),radial-gradient(circle at 10% 80%,rgba(6,31,69,.55),transparent 40%)}.student-shell{width:min(1180px,92%);margin:auto;padding:28px 0 60px}.student-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 38px;border-bottom:1px solid #1b2e48}.student-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-size:1.8rem}.student-brand img{width:42px}.student-brand span{color:#48a9ff}.student-back{color:#a9c5e4;font-size:.85rem}.student-login{min-height:100vh;display:grid;place-items:center;padding:20px}.student-login-card{width:min(430px,100%);padding:38px;background:linear-gradient(150deg,#0d1b2f,#080d17);border:1px solid #1b3b61;border-radius:22px;box-shadow:0 30px 90px #0008}.student-login-card img{width:62px;margin:0 auto 20px}.student-login-card h1{font-size:2rem;text-align:center}.student-login-card p{color:#a9bfd8;text-align:center;margin:12px 0 24px}.student-login-card label{display:block;color:#a9bfd8;font-size:.75rem;text-transform:uppercase;margin:14px 0 6px}.student-login-card input{width:100%;background:#060b14;border:1px solid #24486e;color:#fff;padding:13px;border-radius:8px}.student-login-card .btn{width:100%;margin-top:18px;background:#1475c9;border-color:#1475c9}.student-login-card small{display:block;color:#6f8dac;text-align:center;margin-top:12px}.student-hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:45px 0 30px}.student-hero h1{font-size:clamp(2.3rem,6vw,4.5rem);margin:8px 0}.student-hero p{color:#a9bfd8}.student-avatar{width:72px;height:72px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#1475c9,#0e3058);font-size:1.5rem;font-weight:800;box-shadow:0 12px 30px #02152a}.student-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}.student-kpi,.workout-card,.student-info{background:linear-gradient(145deg,#0d1b2f,#0a111e);border:1px solid #1b3b61;border-radius:16px;padding:22px}.student-kpi span{display:block;color:#8eacca;font-size:.78rem}.student-kpi strong{display:block;font-family:var(--font-title);font-size:1.8rem;margin-top:6px;color:#fff}.student-section-title{display:flex;justify-content:space-between;align-items:center;margin:35px 0 16px}.student-section-title h2{margin:0}.student-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.workout-card{position:relative;overflow:hidden}.workout-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:#1686e8}.workout-card h3{font-size:1.45rem;margin:10px 0}.workout-card p{color:#b5c8dc;white-space:pre-line}.workout-meta{display:flex;gap:9px;flex-wrap:wrap;color:#7fa4ca;font-size:.75rem;margin-bottom:15px}.student-info{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.student-info strong,.student-info span{display:block}.student-info span{color:#a9bfd8;font-size:.85rem;margin-top:4px}.student-empty{color:#9bb4cd;padding:25px;background:#0a1321;border:1px dashed #274d72;border-radius:12px}@media(max-width:700px){.student-kpis,.student-grid,.student-info{grid-template-columns:1fr}.student-hero{display:block}.student-avatar{margin-top:20px}}
</style></head><body class="student-page"><main id="studentApp" class="student-shell"><header class="student-top"><a href="index.html" class="student-brand"><img src="assets/img/logo.png" alt="FORCE GYM"><span>FORCE GYM</span></a><a href="index.html" class="student-back">Voltar ao site ↗</a></header><section class="student-hero"><div><span class="tag">ÁREA DO ALUNO</span><h1>Olá, <span id="studentName">Aluno</span></h1><p>Seu treino, seu ritmo e a orientação certa para evoluir.</p></div><div id="studentAvatar" class="student-avatar">FG</div></section><section class="student-kpis"><div class="student-kpi"><span>Meu objetivo</span><strong id="studentGoal">—</strong></div><div class="student-kpi"><span>Plano</span><strong id="studentPlan">—</strong></div><div class="student-kpi"><span>Professor</span><strong id="studentCoach">—</strong></div></section><div class="student-section-title"><div><span class="tag">ROTINA PERSONALIZADA</span><h2>Treinos liberados</h2></div></div><section id="studentWorkouts" class="student-grid"></section><section id="studentDetails" class="student-info"></section></main><script src="assets/js/student.js"></script></body></html>
